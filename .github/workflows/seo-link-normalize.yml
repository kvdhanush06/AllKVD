name: SEO link normalize

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: "!contains(github.event.head_commit.message, 'SEO link normalize')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize public links
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'https://github.allkvd.dev': 'https://github.com/kvdhanush06',
              'https://linkedin.allkvd.dev': 'https://www.linkedin.com/in/venkata-dhanush-k/',
              'https://x.allkvd.dev': 'https://x.com/kvdhanush06',
              'https://youtube.allkvd.dev': 'https://www.youtube.com/@kvdhanush0608',
              'https://medium.allkvd.dev': 'https://medium.com/@kvdhanush06',
              'https://stackoverflow.allkvd.dev': 'https://stackoverflow.com/users/30895562/venkata-dhanush-kakarlamudi',
              'https://edutoolshub.allkvd.dev': 'https://edutoolshub.onrender.com',
              'https://sociasphere.allkvd.dev': 'https://sociasphere.onrender.com'
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          if any(old in s for old in replacements):
              raise SystemExit('One or more stale vanity URLs remain')

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/seo-link-normalize.yml
          git add index.html .github/workflows/seo-link-normalize.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "SEO link normalize: use canonical public profiles"
            git push
          fi
