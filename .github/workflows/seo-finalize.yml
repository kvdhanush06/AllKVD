name: SEO finalize

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, 'SEO finalize')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified SEO fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_keywords = '''    <meta\n      name="keywords"\n      content="Venkata Dhanush Kakarlamudi, allkvd, Dhanush K, Software Engineer, Backend Engineer, Distributed Systems, FastAPI, Python, PostgreSQL, Redis, RabbitMQ, Prefect FastMCP, GATE 2026"\n    />\n'''
          if old_keywords not in s:
              raise SystemExit('Expected AllKVD keywords block not found')
          s = s.replace(old_keywords, '')

          old_same = '''        "sameAs": [\n          "https://github.com/kvdhanush06",\n          "https://portfolio.allkvd.dev",\n          "https://cogniitsearch.allkvd.dev",\n          "https://termsguard.allkvd.dev",\n          "https://aitoolsdirectory.allkvd.dev",\n          "https://edutoolshub.allkvd.dev",\n          "https://sociasphere.allkvd.dev",\n          "https://youtube.allkvd.dev",\n          "https://x.allkvd.dev",\n          "https://linkedin.allkvd.dev",\n          "https://resume.allkvd.dev",\n          "https://medium.allkvd.dev",\n          "https://stackoverflow.allkvd.dev"\n        ],'''
          new_same = '''        "sameAs": [\n          "https://github.com/kvdhanush06",\n          "https://www.linkedin.com/in/venkata-dhanush-k/",\n          "https://x.com/kvdhanush06",\n          "https://medium.com/@kvdhanush06",\n          "https://stackoverflow.com/users/30895562/venkata-dhanush-kakarlamudi",\n          "https://www.youtube.com/@kvdhanush0608/videos"\n        ],'''
          if old_same not in s:
              raise SystemExit('Expected AllKVD sameAs block not found')
          s = s.replace(old_same, new_same)
          s = s.replace('"alternateName": ["allkvd", "Dhanush K", "kvdhanush06"],', '"alternateName": ["Venkata Dhanush", "Dhanush K", "AllKVD", "kvdhanush", "kvdhanush06"],')
          s = s.replace('"@type": "Person",\n        "name": "Venkata Dhanush Kakarlamudi",', '"@type": "Person",\n        "@id": "https://allkvd.dev/#person",\n        "name": "Venkata Dhanush Kakarlamudi",', 1)
          s = s.replace('href="https://resume.allkvd.dev"', 'href="https://drive.google.com/file/d/1NCT6ZCa_HfxCdScqI-1Q2yA6y2c7O-qA/view"')

          old_footer = '''    <footer class="site-footer">\n      <div class="container">\n        <div class="left">\n          © 2026 <strong>Venkata Dhanush Kakarlamudi (AllKVD)</strong> —\n          <a href="mailto:admin@allkvd.dev">admin@allkvd.dev</a>\n        </div>\n      </div>'''
          new_footer = '''    <footer class="site-footer">\n      <div class="container">\n        <div class="left">\n          <strong>Venkata Dhanush Kakarlamudi</strong> · AllKVD\n          <div class="footer-links" style="margin-top: 8px; display: flex; flex-wrap: wrap; gap: 12px;">\n            <a href="https://allkvd.dev/">AllKVD</a>\n            <a href="https://portfolio.allkvd.dev/">Portfolio</a>\n            <a href="https://github.com/kvdhanush06">GitHub</a>\n            <a href="https://www.linkedin.com/in/venkata-dhanush-k/">LinkedIn</a>\n            <a href="https://x.com/kvdhanush06">X</a>\n            <a href="https://medium.com/@kvdhanush06">Medium</a>\n            <a href="https://stackoverflow.com/users/30895562/venkata-dhanush-kakarlamudi">Stack Overflow</a>\n            <a href="https://www.youtube.com/@kvdhanush0608/videos">YouTube</a>\n          </div>\n          <small style="display: block; margin-top: 8px;"><a href="mailto:admin@allkvd.dev">admin@allkvd.dev</a></small>\n        </div>\n      </div>'''
          if old_footer not in s:
              raise SystemExit('Expected AllKVD footer block not found')
          s = s.replace(old_footer, new_footer)
          p.write_text(s, encoding='utf-8')

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/seo-finalize.yml
          git add index.html .github/workflows/seo-finalize.yml
          git diff --cached --check
          git diff --cached --exit-code || git commit -m "SEO finalize: identity links and footer"
          git push
